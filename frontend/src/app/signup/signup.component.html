<div class="signup-container">
    <div class="signup-card">
      <h2 class="title">Create Account</h2>
      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
        <div class="input-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" formControlName="fullName" placeholder="Enter your full name" />
        </div>
  
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" formControlName="email" placeholder="Enter your email" />
        </div>
  
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" formControlName="password" placeholder="Create a password" />
        </div>
  
        <div class="input-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" formControlName="confirmPassword" placeholder="Confirm your password" />
        </div>

        <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
  
        <button type="submit" class="signup-button">Sign Up</button>
  
        <div class="bottom-text">
          Already have an account?
          <a [routerLink]="'/login'" class="login-link">Login</a>
        </div>
      </form>
    </div>
  </div>
